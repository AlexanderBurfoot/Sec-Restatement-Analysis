name: 'sec_restatement'
version: '1.0.0'
config-version: 2
profile: 'sec_restatement'

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

vars:
  # Below this, a difference between the first and latest reported value for one
  # described fact is treated as rounding rather than a restatement. Expressed
  # as a signed fraction of the first reported value, so 0.001 is one tenth of
  # one percent, matching the bound Stage 1 used for the balance sheet identity.
  # A judgement call, not a bound derived from the data; docs/findings.md
  # records how the restatement rate moves with it.
  restatement_rounding_threshold: 0.001

  # How long a filing is watched before its restatement label is fixed. The
  # loaded range ends 2025-12-31, so a filing from late 2025 has almost no time
  # to be revised: measured without a horizon, the share of 10-K and 10-Q
  # filings ever restated falls from 62.1% in 2023Q1 to 0.7% in 2025Q4, which is
  # elapsed observation time rather than a change in filer behaviour. A fixed
  # horizon makes the label mean the same thing in every quarter, at the cost of
  # dropping filings within one horizon of the end of the range. 180 days is a
  # judgement call: long enough to catch the amendment season that follows an
  # annual report, short enough to leave three quarters of 2025 testable.
  restatement_label_horizon_days: 180

models:
  sec_restatement:
    staging:
      +materialized: view
      +schema: staging
    analysis:
      +materialized: table
      +schema: analysis
      +tags: ['dq']
    marts:
      +materialized: table
      +schema: marts
