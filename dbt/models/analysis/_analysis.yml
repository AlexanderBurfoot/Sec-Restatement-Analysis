version: 2

models:
  - name: dq_scorecard
    description: >
      One row per data quality rule with rows affected and rate. The Stage 1
      headline deliverable.
    columns:
      - name: rule_name
        tests: [unique, not_null]

  - name: dq_unit_inconsistency
    description: >
      Tags reported under more than one unit of measure. Predominantly IFRS tags
      from foreign private issuers reporting in home currency, which is correct
      reporting but means these tags cannot be aggregated across filers without
      FX conversion. The has_suspect_unit_mix flag isolates genuine tagging
      errors, where a currency-denominated tag also appears with a
      non-currency unit.

  - name: dq_custom_tag_share
    description: >
      Share of company-specific XBRL extensions by filer status. Quantifies the
      comparability problem and shows it varies with company size.

  - name: dq_filing_lag_profile
    description: >
      Distribution of days between period end and filing, by form type and filer
      status. Quantifies the window during which reported figures are unknowable.
